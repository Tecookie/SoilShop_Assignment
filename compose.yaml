name: soilshop
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soilshop
      POSTGRES_USER: soilshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    volumes: [shop-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U soilshop -d soilshop]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  calculation:
    build:
      context: .
      args: { PROJECT: SoilShop.Calculation }
    environment: { ASPNETCORE_ENVIRONMENT: Development }
  api:
    build:
      context: .
      args: { PROJECT: SoilShop.Api }
    environment:
      ASPNETCORE_HTTP_PORTS: '8080'
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Shop: Host=postgres;Database=soilshop;Username=soilshop;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Calculation__Address: http://calculation:8082
      Jwt__Key: ${JWT_KEY:?Run scripts/setup.ps1 first}
      Bootstrap__Username: ${BOOTSTRAP_USERNAME:-admin}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Run scripts/setup.ps1 first}
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
      DemoSeed__EmployeeUsername: ${DEMO_EMPLOYEE_USERNAME:-}
      DemoSeed__EmployeePassword: ${DEMO_EMPLOYEE_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      calculation: { condition: service_started }
  worker:
    build:
      context: .
      args: { PROJECT: SoilShop.Worker }
    environment:
      ConnectionStrings__Shop: Host=postgres;Database=soilshop;Username=soilshop;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_started }
  web:
    build: { context: src/soilshop-web }
    ports: ['127.0.0.1:${WEB_PORT:-8080}:80']
    depends_on: [api]
volumes:
  shop-data:
  redis-data:
