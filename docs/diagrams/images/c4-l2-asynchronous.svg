<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="c4-l2-asynchronous-title c4-l2-asynchronous-desc" id="c4-l2-asynchronous-root"><title id="c4-l2-asynchronous-title">C2 — Async Replenishment and Backups</title><desc id="c4-l2-asynchronous-desc">A filtered Level 2 perspective shows API outbox publishing, Redis consumption, persistent job state and Worker-owned backup archives.</desc><defs>
      <style>#c4-l2-asynchronous-root { color: #142B49; font-family: Segoe UI,Arial,sans-serif; }
      #c4-l2-asynchronous-root .diagram-container { width:100%;overflow-x:auto }
      #c4-l2-asynchronous-root a { color:#175E9B }
      #c4-l2-asynchronous-root .diagram-container { overflow-x:visible }</style><marker id="c4-l2-asynchronous-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#48617C"/></marker></defs><rect width="1600" height="960" fill="#FFFFFF"/><text x="40" y="40" font-size="28" fill="#142B49" font-weight="600" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">C2 — Async Replenishment and Backups</text><text x="40" y="64" font-size="9" fill="#48617C" font-weight="400" text-anchor="start" font-family="Consolas, monospace">POTTING SOIL SHOP / PRN232 / DESIGN</text><path d="M 344,424 L 480,424" fill="none" stroke="#48617C" stroke-width="1.5" marker-end="url(#c4-l2-asynchronous-arrow)"/><rect x="391.4" y="388" width="41.2" height="20" fill="#FFFFFF"/><text x="412" y="402" font-size="9" fill="#48617C" font-weight="400" text-anchor="middle" font-family="Consolas, monospace">XADD</text><path d="M 928,424 L 760,424" fill="none" stroke="#48617C" stroke-width="1.5" marker-end="url(#c4-l2-asynchronous-arrow)"/><rect x="804.5" y="388" width="79.0" height="20" fill="#FFFFFF"/><text x="844" y="402" font-size="9" fill="#48617C" font-weight="400" text-anchor="middle" font-family="Consolas, monospace">READ / ACK</text><path d="M 344,500 L 392.0,500 Q 400,500 400,508.0 L 400,744.0 Q 400,752 408.0,752 L 928,752" fill="none" stroke="#48617C" stroke-width="1.5" marker-end="url(#c4-l2-asynchronous-arrow)"/><rect x="595.9" y="716" width="104.2" height="20" fill="#FFFFFF"/><text x="648" y="730" font-size="9" fill="#48617C" font-weight="400" text-anchor="middle" font-family="Consolas, monospace">DURABLE INTENT</text><path d="M 1024,544 L 1024,680" fill="none" stroke="#48617C" stroke-width="1.5" marker-end="url(#c4-l2-asynchronous-arrow)"/><rect x="1093.35" y="604" width="85.3" height="20" fill="#FFFFFF"/><text x="1136" y="618" font-size="9" fill="#48617C" font-weight="400" text-anchor="middle" font-family="Consolas, monospace">EF / PGDUMP</text><path d="M 1088,344 L 1088,272" fill="none" stroke="#48617C" stroke-width="1.5" marker-end="url(#c4-l2-asynchronous-arrow)"/><rect x="1160.5" y="296" width="79.0" height="20" fill="#FFFFFF"/><text x="1200" y="310" font-size="9" fill="#48617C" font-weight="400" text-anchor="middle" font-family="Consolas, monospace">FILE WRITE</text><rect x="64" y="344" width="280" height="200" rx="8" fill="#E8F6FA" stroke="#007C91" stroke-width="1.2"/><text x="80" y="368" font-size="9" fill="#48617C" font-weight="400" text-anchor="start" font-family="Consolas, monospace">CONTAINER</text><text x="80" y="392" font-size="16" fill="#142B49" font-weight="600" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">REST API</text><text x="80" y="412" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Business TX writes outbox row</text><text x="80" y="428" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Hosted relay publishes XADD</text><text x="80" y="444" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Mark published only after send</text><text x="80" y="460" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Manual summary / backup request</text><rect x="480" y="344" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#48617C" stroke-width="1.2"/><text x="496" y="368" font-size="9" fill="#48617C" font-weight="400" text-anchor="start" font-family="Consolas, monospace">CONTAINER</text><text x="496" y="392" font-size="16" fill="#142B49" font-weight="600" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Redis Streams</text><text x="496" y="412" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">InventoryChanged / job requests</text><text x="496" y="428" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Consumer group and pending list</text><text x="496" y="444" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Reclaim after crash; ACK last</text><text x="496" y="460" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">No business stock authority</text><rect x="928" y="344" width="304" height="200" rx="8" fill="#E8F6FA" stroke="#007C91" stroke-width="1.2"/><text x="944" y="368" font-size="9" fill="#48617C" font-weight="400" text-anchor="start" font-family="Consolas, monospace">CONTAINER</text><text x="944" y="392" font-size="16" fill="#142B49" font-weight="600" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Background Worker</text><text x="944" y="412" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Read current stock and thresholds</text><text x="944" y="428" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Upsert one active suggestion</text><text x="944" y="444" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Daily/manual reports and backups</text><text x="944" y="460" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Idempotent handling + reconciliation</text><rect x="928" y="680" width="304" height="144" rx="8" fill="#FFFFFF" stroke="#48617C" stroke-width="1.2"/><path d="M928,696 Q1080.0,712 1232,696" stroke="#48617C" fill="none"/><text x="944" y="716" font-size="9" fill="#48617C" font-weight="400" text-anchor="start" font-family="Consolas, monospace">DATABASE</text><text x="944" y="736" font-size="16" fill="#142B49" font-weight="600" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">PostgreSQL</text><text x="944" y="756" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Outbox / suggestion and job state</text><text x="944" y="772" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Consistent report snapshot</text><rect x="928" y="128" width="304" height="144" rx="8" fill="#FFFFFF" stroke="#48617C" stroke-width="1.2"/><path d="M928,144 Q1080.0,160 1232,144" stroke="#48617C" fill="none"/><text x="944" y="164" font-size="9" fill="#48617C" font-weight="400" text-anchor="start" font-family="Consolas, monospace">FILE STORE</text><text x="944" y="184" font-size="16" fill="#142B49" font-weight="600" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Backup Archive Volume</text><text x="944" y="204" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">pg_dump custom format</text><text x="944" y="220" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Retain seven successful archives</text><text x="64" y="176" font-size="14" fill="#007C91" font-weight="600" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">ASYNCHRONOUS FOLLOW-UP</text><text x="64" y="204" font-size="12" fill="#142B49" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Redis delay does not undo or delay a completed sale.</text><text x="64" y="228" font-size="12" fill="#142B49" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Duplicate delivery must not duplicate suggestions or jobs.</text><line x1="40" y1="896" x2="1560" y2="896" stroke="#D5DFEA"/><text x="40" y="920" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">XADD = API producer    READ / ACK = Worker consumer    DB intent and consumer results survive process restarts</text><text x="40" y="944" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Daily schedules also run inside Worker. Worker writes dump files; PostgreSQL is queried over its normal connection.</text></svg>
