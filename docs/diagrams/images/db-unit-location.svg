ze="9" fill="#48617C" font-weight="400" text-anchor="end" font-family="Consolas, monospace">smallint</text><text x="908" y="284" font-size="9" fill="#48617C" font-weight="400" text-anchor="start" font-family="Consolas, monospace">+ 4 more columns — see dictionary</text><line x1="40" y1="656" x2="1240" y2="656" stroke="#D5DFEA"/><text x="40" y="680" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">FK arrows: child column → parent key    NO ACTION = restrict deletion    ? = nullable; all columns in dictionary</text><text x="40" y="704" font-size="11" fill="#48617C" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Building link is composite: Units(ProjectId, BuildingId) → Buildings(ProjectId, Id). Only Apartments have a Building.</text></svg>
